name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatierung prüfen
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: MinGW in den Suchpfad aufnehmen
        shell: bash
        run: echo "${{ steps.msys2.outputs.msys2-location }}\\mingw64\\bin" >> "$GITHUB_PATH"
      - name: Windows-Programm bauen (eigenes Fenster, CGO/WebView2)
        env:
          CGO_ENABLED: "1"
        shell: bash
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o Kleingarten-Manager.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Kleingarten-Manager
          path: Kleingarten-Manager.exe
          if-no-files-found: error

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: macOS-Programme bauen (Apple Silicon + Intel, eigenes Fenster)
        run: |
          CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o Kleingarten-Manager-arm64 .
          CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "-s -w" -o Kleingarten-Manager-amd64 .
