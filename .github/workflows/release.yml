name: Release

# Neue Version veröffentlichen: git tag v1.1 && git push origin v1.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64
      - name: Windows-Programm bauen (eigenes Fenster, CGO/WebView2)
        env:
          CGO_ENABLED: "1"
        shell: bash
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.appVersion=${GITHUB_REF_NAME#v}" -o Kleingarten-Manager.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: Kleingarten-Manager.exe
          if-no-files-found: error

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: macOS-Programme bauen (Apple Silicon + Intel, eigenes Fenster)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.appVersion=$VERSION" -o Kleingarten-Manager-arm64 .
          CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "-s -w -X main.appVersion=$VERSION" -o Kleingarten-Manager-amd64 .
      - name: macOS-App bündeln
        run: |
          APP=Kleingarten-Manager.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          mv Kleingarten-Manager-arm64 Kleingarten-Manager-amd64 "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/Kleingarten-Manager-arm64" "$APP/Contents/MacOS/Kleingarten-Manager-amd64"
          cat > "$APP/Contents/MacOS/Kleingarten-Manager" <<'SH'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          if [ "$(uname -m)" = "arm64" ]; then exec "$DIR/Kleingarten-Manager-arm64" "$@"; else exec "$DIR/Kleingarten-Manager-amd64" "$@"; fi
          SH
          chmod +x "$APP/Contents/MacOS/Kleingarten-Manager"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Kleingarten-Manager</string>
            <key>CFBundleDisplayName</key><string>Kleingarten-Manager</string>
            <key>CFBundleIdentifier</key><string>de.kleingarten-manager.app</string>
            <key>CFBundleVersion</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>Kleingarten-Manager</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          zip -r -y Kleingarten-Manager-mac.zip "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: Kleingarten-Manager-mac.zip
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
      - uses: actions/download-artifact@v4
        with:
          name: macos-zip
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Kleingarten-Manager.exe Kleingarten-Manager-mac.zip --title "Kleingarten-Manager $GITHUB_REF_NAME" --generate-notes
