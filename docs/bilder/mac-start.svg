<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" fill="none" stroke="#1f4f2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Erster Start auf dem Mac in drei Schritten</title>
<desc id="d">1. App doppelklicken, macOS blockiert sie. 2. In den Systemeinstellungen unter Datenschutz und Sicherheit auf Dennoch öffnen klicken. 3. Im Rückfragefenster Öffnen wählen.</desc>

<!-- Schritt 1: Programme-Ordner mit App und Warnung -->
<g>
  <rect x="20" y="30" width="260" height="200" rx="10" fill="#fff"/>
  <path d="M20 58 H280" stroke-width="1.5"/>
  <circle cx="38" cy="44" r="4" fill="#cfe3d3" stroke-width="1.2"/><circle cx="52" cy="44" r="4" fill="#cfe3d3" stroke-width="1.2"/><circle cx="66" cy="44" r="4" fill="#cfe3d3" stroke-width="1.2"/>
  <text x="150" y="49" font-size="12" text-anchor="middle" fill="#1f4f2b" stroke="none">Programme</text>
  <rect x="50" y="78" width="54" height="54" rx="12" fill="#e9f3eb"/>
  <path d="M64 116 c0-18 10-28 28-28 0 18-10 28-26 28z" fill="#fff" stroke-width="1.5"/>
  <text x="77" y="150" font-size="10.5" text-anchor="middle" fill="#1f4f2b" stroke="none">Kleingarten-</text>
  <text x="77" y="163" font-size="10.5" text-anchor="middle" fill="#1f4f2b" stroke="none">Manager</text>
  <rect x="128" y="86" width="136" height="96" rx="8" fill="#f4f9f4" stroke-width="1.5"/>
  <path d="M146 104 l10 -12 10 12 z" fill="#fff" stroke-width="1.5"/>
  <path d="M156 97 v3" stroke-width="1.5"/>
  <text x="196" y="104" font-size="10" text-anchor="middle" fill="#1f4f2b" stroke="none">wurde nicht</text>
  <text x="196" y="117" font-size="10" text-anchor="middle" fill="#1f4f2b" stroke="none">geöffnet</text>
  <rect x="146" y="148" width="100" height="22" rx="5" fill="#fff" stroke-width="1.5"/>
  <text x="196" y="163" font-size="10.5" text-anchor="middle" fill="#1f4f2b" stroke="none">Fertig</text>
</g>
<circle cx="40" cy="268" r="15" fill="#1f4f2b" stroke="none"/>
<text x="40" y="273" font-size="15" font-weight="700" text-anchor="middle" fill="#fff" stroke="none">1</text>
<text x="64" y="266" font-size="13" font-weight="700" fill="#1f4f2b" stroke="none">App doppelklicken</text>
<text x="64" y="284" font-size="12" fill="#3c5a43" stroke="none">macOS hält sie beim ersten Mal an.</text>
<text x="64" y="300" font-size="12" fill="#3c5a43" stroke="none">Auf »Fertig« klicken.</text>

<!-- Schritt 2: Systemeinstellungen, Datenschutz & Sicherheit -->
<g>
  <rect x="320" y="30" width="260" height="200" rx="10" fill="#fff"/>
  <path d="M320 58 H580" stroke-width="1.5"/>
  <circle cx="338" cy="44" r="4" fill="#cfe3d3" stroke-width="1.2"/><circle cx="352" cy="44" r="4" fill="#cfe3d3" stroke-width="1.2"/><circle cx="366" cy="44" r="4" fill="#cfe3d3" stroke-width="1.2"/>
  <text x="450" y="49" font-size="12" text-anchor="middle" fill="#1f4f2b" stroke="none">Systemeinstellungen</text>
  <path d="M410 58 V230" stroke-width="1.5"/>
  <rect x="328" y="70" width="74" height="10" rx="3" fill="#f4f9f4" stroke="none"/>
  <rect x="328" y="88" width="74" height="10" rx="3" fill="#f4f9f4" stroke="none"/>
  <rect x="326" y="104" width="78" height="30" rx="5" fill="#cfe3d3" stroke-width="1.5"/>
  <text x="365" y="116" font-size="9" text-anchor="middle" fill="#1f4f2b" stroke="none">Datenschutz</text>
  <text x="365" y="128" font-size="9" text-anchor="middle" fill="#1f4f2b" stroke="none">&amp; Sicherheit</text>
  <rect x="328" y="142" width="74" height="10" rx="3" fill="#f4f9f4" stroke="none"/>
  <text x="422" y="84" font-size="10" fill="#1f4f2b" stroke="none">Sicherheit</text>
  <rect x="420" y="94" width="148" height="10" rx="3" fill="#f4f9f4" stroke="none"/>
  <text x="422" y="128" font-size="9.5" fill="#1f4f2b" stroke="none">„Kleingarten-Manager“ wurde</text>
  <text x="422" y="141" font-size="9.5" fill="#1f4f2b" stroke="none">blockiert …</text>
  <rect x="470" y="156" width="98" height="26" rx="6" fill="#1f4f2b" stroke="none"/>
  <text x="519" y="173" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" stroke="none">Dennoch öffnen</text>
  <path d="M556 196 l8 22 4 -8 9 -2 z" fill="#fff" stroke-width="1.5"/>
</g>
<circle cx="340" cy="268" r="15" fill="#1f4f2b" stroke="none"/>
<text x="340" y="273" font-size="15" font-weight="700" text-anchor="middle" fill="#fff" stroke="none">2</text>
<text x="364" y="266" font-size="13" font-weight="700" fill="#1f4f2b" stroke="none">»Dennoch öffnen«</text>
<text x="364" y="284" font-size="12" fill="#3c5a43" stroke="none">Systemeinstellungen → Datenschutz</text>
<text x="364" y="300" font-size="12" fill="#3c5a43" stroke="none">&amp; Sicherheit, ganz nach unten.</text>

<!-- Schritt 3: Rückfrage mit »Öffnen« -->
<g>
  <rect x="620" y="30" width="260" height="200" rx="10" fill="#fff"/>
  <rect x="650" y="62" width="200" height="140" rx="10" fill="#f4f9f4" stroke-width="1.5"/>
  <rect x="728" y="74" width="44" height="44" rx="10" fill="#e9f3eb"/>
  <path d="M740 106 c0-14 8-22 22-22 0 14-8 22-20 22z" fill="#fff" stroke-width="1.5"/>
  <text x="750" y="136" font-size="10" text-anchor="middle" fill="#1f4f2b" stroke="none">Trotzdem öffnen?</text>
  <rect x="664" y="156" width="80" height="26" rx="6" fill="#fff" stroke-width="1.5"/>
  <text x="704" y="173" font-size="11" text-anchor="middle" fill="#1f4f2b" stroke="none">Abbrechen</text>
  <rect x="756" y="156" width="80" height="26" rx="6" fill="#1f4f2b" stroke="none"/>
  <text x="796" y="173" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" stroke="none">Öffnen</text>
  <path d="M822 190 l8 22 4 -8 9 -2 z" fill="#fff" stroke-width="1.5"/>
</g>
<circle cx="640" cy="268" r="15" fill="#1f4f2b" stroke="none"/>
<text x="640" y="273" font-size="15" font-weight="700" text-anchor="middle" fill="#fff" stroke="none">3</text>
<text x="664" y="266" font-size="13" font-weight="700" fill="#1f4f2b" stroke="none">»Öffnen« bestätigen</text>
<text x="664" y="284" font-size="12" fill="#3c5a43" stroke="none">Ggf. Mac-Passwort eingeben.</text>
<text x="664" y="300" font-size="12" fill="#3c5a43" stroke="none">Ab jetzt startet sie normal.</text>
</svg>
